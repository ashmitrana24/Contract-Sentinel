[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datagen"
version = "0.1.0"
description = "Legal-document fraud & integrity dataset generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "reportlab>=5.0.1",
    "PyMuPDF>=1.28.2",
    "pikepdf>=9.0.0",
    "num2words>=0.5.14",
    "pydantic>=2.12.5",
    "typer>=0.15.0",
]

[project.scripts]
datagen = "datagen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/datagen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "T20", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["datagen"]
