[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clauseguard"
version = "0.2.0"
description = "Contract integrity and risk analysis platform - backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "SQLAlchemy>=2.0.48",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    "PyMuPDF>=1.28.2",
    "redis>=8.1.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.16.10",
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clauseguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short -p no:warnings"
markers = [
    "unit: fast unit tests (no services required)",
    "integration: real Postgres and Redis required",
    "dataset: requires data/generated to be present",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "T20", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/clauseguard/bench/*" = ["T201"]
"tests/*" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["clauseguard"]
